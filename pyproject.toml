
[project]
name = "on-this-day-agent"
version = "0.1.0"
description = "Agentic LangChain system that turns Wikipedia history into a news video"
requires-python = ">=3.10"

dependencies = [
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "requests",
    "pydantic",
    "pydantic-settings>=2.12.0",
    "moviepy>=2.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# Source lives in src/ without an installable package (no [build-system]),
# so point pytest at it directly instead of relying on an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
